services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: infotech-yii2-php:8.4-prod
    restart: unless-stopped
    volumes: &app-code
      - ./app:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      YII_ENV: ${YII_ENV:-prod}
      YII_DEBUG: ${YII_DEBUG:-0}

  queue-email:
    image: infotech-yii2-php:8.4-prod
    restart: unless-stopped
    volumes: *app-code

  queue-sms:
    image: infotech-yii2-php:8.4-prod
    restart: unless-stopped
    volumes: *app-code

  sms-send:
    image: infotech-yii2-php:8.4-prod
    restart: unless-stopped
    volumes: *app-code

  nginx:
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.infotech-yii2.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.infotech-yii2.entrypoints=websecure
      - traefik.http.routers.infotech-yii2.tls=true
      - traefik.http.routers.infotech-yii2.tls.certresolver=letsencrypt-tls
      - traefik.http.services.infotech-yii2.loadbalancer.server.port=80
      - traefik.http.services.infotech-yii2.loadbalancer.passhostheader=true

  mysql:
    platform: linux/amd64
    restart: unless-stopped

  redis:
    restart: unless-stopped

  memcached:
    restart: unless-stopped
