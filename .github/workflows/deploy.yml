# Production deploy.
#
# Secrets live in GitHub Environment "production" (Settings → Environments),
# not in the repository. Change a value there and click "Run workflow".
#
# One-time server setup:
#   sudo mkdir -p /opt/infotech-yii2
#   sudo git clone git@github.com:<owner>/infotech-yii2.git /opt/infotech-yii2
# Deploy user needs Docker, and a GitHub deploy key with read access.
# Traefik on this host uses certresolver "letsencrypt" (DNS-01 Cloudflare).
# cyprus-shop.online must be in the same Cloudflare account as Traefik's token.
#
# Create GitHub Environment "production" (Settings → Environments).
# Required Environment secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY, DEPLOY_SSH_KNOWN_HOSTS
#   COOKIE_VALIDATION_KEY, MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, DB_PASSWORD,
#   SMS_API_KEY
#
# Required Environment variables:
#   APP_DOMAIN
#
# Optional Environment variables (defaults in this file):
#   DEPLOY_PATH, DEPLOY_SSH_PORT, YII_ENV, YII_DEBUG,
#   MYSQL_DATABASE, MYSQL_USER, DB_NAME, DB_USER, DB_HOST, DB_PORT,
#   REDIS_*, MEMCACHED_*, QUEUE_*, MAIL_USE_FILE_TRANSPORT, SMS_USE_FILE_TRANSPORT,
#   SMS_API_URL, SMS_FROM, SMS_TEST, SMS_CALLBACK_URL, SMS_CALLBACK_METHOD

name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy /opt
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/infotech-yii2' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      YII_ENV: ${{ vars.YII_ENV || 'prod' }}
      YII_DEBUG: ${{ vars.YII_DEBUG || '0' }}
      COOKIE_VALIDATION_KEY: ${{ secrets.COOKIE_VALIDATION_KEY }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || 'book_store' }}
      MYSQL_USER: ${{ vars.MYSQL_USER || 'infotech' }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      DB_HOST: ${{ vars.DB_HOST || 'mysql' }}
      DB_PORT: ${{ vars.DB_PORT || '3306' }}
      DB_NAME: ${{ vars.DB_NAME || 'book_store' }}
      TEST_DB_NAME: ${{ vars.TEST_DB_NAME || 'book_store_test' }}
      DB_USER: ${{ vars.DB_USER || 'infotech' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      REDIS_HOST: ${{ vars.REDIS_HOST || 'redis' }}
      REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
      REDIS_DATABASE: ${{ vars.REDIS_DATABASE || '0' }}
      MEMCACHED_HOST: ${{ vars.MEMCACHED_HOST || 'memcached' }}
      MEMCACHED_PORT: ${{ vars.MEMCACHED_PORT || '11211' }}
      MAIL_USE_FILE_TRANSPORT: ${{ vars.MAIL_USE_FILE_TRANSPORT || '0' }}
      SMS_USE_FILE_TRANSPORT: ${{ vars.SMS_USE_FILE_TRANSPORT || '0' }}
      SMS_API_URL: ${{ vars.SMS_API_URL || 'https://smspilot.ru/api.php' }}
      SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
      SMS_FROM: ${{ vars.SMS_FROM || '' }}
      SMS_TEST: ${{ vars.SMS_TEST || '1' }}
      SMS_CALLBACK_URL: ${{ vars.SMS_CALLBACK_URL || '' }}
      SMS_CALLBACK_METHOD: ${{ vars.SMS_CALLBACK_METHOD || 'post' }}
      QUEUE_EMAIL_CHANNEL: ${{ vars.QUEUE_EMAIL_CHANNEL || 'queue-email' }}
      QUEUE_SMS_CHANNEL: ${{ vars.QUEUE_SMS_CHANNEL || 'queue-sms' }}
    steps:
      - name: Render .env from GitHub Environment
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path

          required = [
              "DEPLOY_HOST",
              "DEPLOY_USER",
              "COOKIE_VALIDATION_KEY",
              "MYSQL_ROOT_PASSWORD",
              "MYSQL_PASSWORD",
              "DB_PASSWORD",
              "APP_DOMAIN",
              "SMS_API_KEY",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Environment values: " + ", ".join(missing))

          lines = [
              "COMPOSE_PROJECT_NAME=infotech-yii2",
              "COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml",
              f"APP_DOMAIN={os.environ['APP_DOMAIN']}",
              f"YII_ENV={os.environ['YII_ENV']}",
              f"YII_DEBUG={os.environ['YII_DEBUG']}",
              f"COOKIE_VALIDATION_KEY={os.environ['COOKIE_VALIDATION_KEY']}",
              f"MYSQL_ROOT_PASSWORD={os.environ['MYSQL_ROOT_PASSWORD']}",
              f"MYSQL_DATABASE={os.environ['MYSQL_DATABASE']}",
              f"MYSQL_USER={os.environ['MYSQL_USER']}",
              f"MYSQL_PASSWORD={os.environ['MYSQL_PASSWORD']}",
              f"DB_HOST={os.environ['DB_HOST']}",
              f"DB_PORT={os.environ['DB_PORT']}",
              f"DB_NAME={os.environ['DB_NAME']}",
              f"TEST_DB_NAME={os.environ['TEST_DB_NAME']}",
              f"DB_USER={os.environ['DB_USER']}",
              f"DB_PASSWORD={os.environ['DB_PASSWORD']}",
              f"REDIS_HOST={os.environ['REDIS_HOST']}",
              f"REDIS_PORT={os.environ['REDIS_PORT']}",
              f"REDIS_DATABASE={os.environ['REDIS_DATABASE']}",
              f"MEMCACHED_HOST={os.environ['MEMCACHED_HOST']}",
              f"MEMCACHED_PORT={os.environ['MEMCACHED_PORT']}",
              f"MAIL_USE_FILE_TRANSPORT={os.environ['MAIL_USE_FILE_TRANSPORT']}",
              f"SMS_USE_FILE_TRANSPORT={os.environ['SMS_USE_FILE_TRANSPORT']}",
              f"SMS_API_URL={os.environ['SMS_API_URL']}",
              f"SMS_API_KEY={os.environ['SMS_API_KEY']}",
              f"SMS_FROM={os.environ.get('SMS_FROM', '')}",
              f"SMS_TEST={os.environ['SMS_TEST']}",
              f"SMS_CALLBACK_URL={os.environ.get('SMS_CALLBACK_URL', '')}",
              f"SMS_CALLBACK_METHOD={os.environ['SMS_CALLBACK_METHOD']}",
              f"QUEUE_EMAIL_CHANNEL={os.environ['QUEUE_EMAIL_CHANNEL']}",
              f"QUEUE_SMS_CHANNEL={os.environ['QUEUE_SMS_CHANNEL']}",
          ]
          path = Path(".env")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Reset main, install .env, restart stack
        run: |
          set -euo pipefail
          scp .env "deploy-target:${DEPLOY_PATH}/.env.next"
          ssh deploy-target env DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mv -f .env.next .env
          chmod 600 .env
          docker compose build
          docker compose run --rm --no-deps --user root php \
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          docker compose up -d
          docker compose exec -T php php yii migrate --interactive=0
          REMOTE
          rm -f .env
