actor: Tester
bootstrap: _bootstrap.php
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    helpers: tests/_support
settings:
    memory_limit: 1024M
    colors: true
modules:
    config:
        Yii2:
            configFile: 'config/test.php'

coverage:
    enabled: true
    show_uncovered: true
    include:
        - assets/*
        - bootstrap/*
        - commands/*
        - components/*
        - controllers/*
        - events/*
        - exceptions/*
        - handlers/*
        - jobs/*
        - models/*
        - repositories/*
        - services/*
        - widgets/*
    exclude:
        - config/*
        - mail/*
        - migrations/*
        - runtime/*
        - tests/*
        - vendor/*
        - views/*
        - web/*
