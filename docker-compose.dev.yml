services:
  php:
    volumes: &app-code
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      YII_ENV: ${YII_ENV:-dev}
      YII_DEBUG: ${YII_DEBUG:-1}

  queue-email:
    volumes: *app-code

  queue-sms:
    volumes: *app-code

  nginx:
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  adminer:
    image: adminer:4
    container_name: infotech-yii2-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.infotech-yii2-adminer.rule=Host(`${ADMINER_DOMAIN}`)
      - traefik.http.routers.infotech-yii2-adminer.entrypoints=web
      - traefik.http.services.infotech-yii2-adminer.loadbalancer.server.port=8080
      - traefik.http.services.infotech-yii2-adminer.loadbalancer.passhostheader=true
